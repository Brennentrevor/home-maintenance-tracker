/** Parse 'YYYY-MM-DD' to a local Date at midnight. */
function parseDate(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
/** Format Date to 'YYYY-MM-DD'. */
function fmtISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayISO() { return fmtISO(new Date()); }
/** Add calendar months, clamping to month end (Jan 31 + 1 month = Feb 28/29). */
function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth(), 1);
  d.setMonth(d.getMonth() + n);

  d.setDate(Math.min(date.getDate(), last));
  return d;

function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function daysBetween(a, b) { return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000); }
/** Interval length in days (approx) — used for the due-soon window. */
function intervalDays(t) {
  const v = Number(t.interval_value) || 0;
  return t.interval_unit === 'days' ? v : t.interval_unit === 'weeks' ? v * 7 : t.interval_unit === 'months' ? v * 30 : Infinity;
}
/** Miles interval for a task (primary if unit=miles, else alt). */
function milesInterval(t) { return t.interval_unit === 'miles' ? Number(t.interval_value) || null : (t.alt_interval_miles || null); }
/** Next due date (Date or null) for time-based intervals. */
function nextDueDate(t) {
  if (t.interval_unit === 'miles') return t.last_done ? null : parseDate(t.first_due);
  if (!t.last_done) return parseDate(t.first_due);
  const last = parseDate(t.last_done), v = Number(t.interval_value) || 0;
  if (t.interval_unit === 'months') return addMonths(last, v);
  if (t.interval_unit === 'weeks') return addDays(last, v * 7);

}

/**
 * Compute status. today: Date; odometer: number|null.
 * Returns {due: Date|null, days: int|null, milesLeft: int|null, status: 'ok'|'soon'|'over'|'none'}

function computeStatus(t, today, odometer) {
  const due = nextDueDate(t);
  let status = 'none', days = null, milesLeft = null;
  if (due) {
    days = daysBetween(today, due);
    const win = intervalDays(t) < 60 ? 14 : 30;
    status = days < 0 ? 'over' : days <= win ? 'soon' : 'ok';
  }
  const mi = milesInterval(t);
  if (mi && t.last_done_miles != null && odometer != null && odometer !== '') {
    milesLeft = Number(t.last_done_miles) + mi - Number(odometer);
    const ms = milesLeft < 0 ? 'over' : milesLeft <= 500 ? 'soon' : 'ok';
    if (RANK[ms] > RANK[status]) status = ms;
  }
  return { due, days, milesLeft, status };
}

  if (u !== 'miles' && t.alt_interval_miles) s += ` or ${fmt(t.alt_interval_miles)} mi`;

}

/** Build an .ics calendar for tasks: all-day event, alarms 7 days before and on the day. */
function buildICS(items) {
  const esc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc(task.name + ' due in 1 week')}`, 'TRIGGER:-P7D', 'END:VALARM',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc(task.name + ' due today')}`, 'TRIGGER;RELATED=START:PT9H', 'END:VALARM',
      'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n') + '\r\n';
}
function googleCalUrl(task, due) {

async function loadAll() {

// Offline queue: [{op:'upsert'|'delete'|'insert', table, row|id}]
function queue(item) { const q = LS.get('queue', []); q.push(item); LS.set('queue', q); }
async function flushQueue() {
  const q = LS.get('queue', []); if (!q.length || !navigator.onLine) return;
  const rest = [];
  for (const it of q) {
    let r;
    if (it.op === 'delete') r = await sb.from(it.table).delete().eq('id', it.id);
    else if (it.op === 'insert') r = await sb.from(it.table).insert(it.row);
    else r = await sb.from(it.table).upsert(it.row);
    if (r.error && !navigator.onLine) rest.push(it); else if (r.error) console.warn('dropped queued op', it, r.error);
  }
  LS.set('queue', rest);
  await loadAll();
}
/** Write helper: performs online or queues offline; also updates local state optimistically. */
async function write(op, table, payload) {
  if (table === 'maint_tasks') {
    if (op === 'delete') state.tasks = state.tasks.filter((t) => t.id !== payload);
    else { const i = state.tasks.findIndex((t) => t.id === payload.id); if (i >= 0) state.tasks[i] = { ...state.tasks[i], ...payload }; else state.tasks.push(payload); }
    LS.set('tasks', state.tasks);
  }
  if (table === 'maint_settings') { state.settings[payload.key] = payload.value; LS.set('settings', state.settings); }
  render();
  const item = op === 'delete' ? { op, table, id: payload } : { op, table, row: payload };
  if (!navigator.onLine) { queue(item); return; }
  const r = op === 'delete' ? await sb.from(table).delete().eq('id', payload) : op === 'insert' ? await sb.from(table).insert(payload) : await sb.from(table).upsert(payload);
  if (r.error) { if (!navigator.onLine) queue(item); else alert('Could not save: ' + r.error.message); }
}

let channel = null;
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('maint-live');
  ['maint_tasks', 'maint_completions', 'maint_settings'].forEach((tb) =>
    channel.on('postgres_changes', { event: '*', schema: 'public', table: tb }, (p) => onChange(tb, p)));
  channel.subscribe((status) => setLive(status === 'SUBSCRIBED'));
}
function onChange(tb, p) {
  if (tb === 'maint_tasks') {
    if (p.eventType === 'DELETE') state.tasks = state.tasks.filter((t) => t.id !== p.old.id);
    else { const i = state.tasks.findIndex((t) => t.id === p.new.id); if (i >= 0) state.tasks[i] = p.new; else state.tasks.push(p.new); }
    LS.set('tasks', state.tasks);
  } else if (tb === 'maint_settings' && p.new) { state.settings[p.new.key] = p.new.value; LS.set('settings', state.settings); }
  else if (tb === 'maint_completions') { const id = (p.new || p.old)?.task_id; if (id) delete state.completions[id]; }
  render();
  if (openTaskId) openTask(openTaskId, true);
}

  if (!configured || !window.supabase) {
    if (!configured) return renderSetup();
    // supabase-js failed to load (offline first run): show cached data read-only
    state.me = LS.get('me', null); if (state.me) { setLive(false); return render(); }
    return ($('#app').innerHTML = '<p class="setup">You’re offline. Connect once to sign in. ✨</p>');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((evt, session) => { if (evt === 'SIGNED_IN' || evt === 'SIGNED_OUT') onSession(session); });
  await onSession(data.session);
}
addEventListener('online', async () => { if (sb && state.me) { await flushQueue(); subscribe(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sb && state.me && navigator.onLine) loadAll(); });
addEventListener('offline', () => { setLive(false); render(); });
boot();
</script>
</body>
</html>
